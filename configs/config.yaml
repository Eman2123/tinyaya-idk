model:
  # TinyAya variant: tiny-aya-global (confirm with organizers on Discord)
  name: "CohereLabs/tiny-aya-global"
  dtype: "float16"
  load_in_4bit: false
  max_new_tokens: 16

sampling:
  n_samples: 5
  temperature: 0.7
  seed: 42
  probe_layers: [-12, -1]   # a middle-ish and a late layer (negative = from the end)
  batch_size: 16

languages:
  anchor: en
  targets: [es, ar, ms]   # confirm TinyAya support; MKQA has ms but no id/sw

splits:
  build: 1000
  val: 250
  test: 250

labels:
  consistency_min_agree: 4    # of 5 samples

probe:
  layer_index: 0              # index into sampling.probe_layers
  C: 1.0

training:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  epochs: 2
  lr: 1.0e-4
  batch_size: 8
  grad_accum: 2
  max_seq_len: 256
  known_share: 0.5            # fraction of known (answer) examples in the training set
  seeds: [1, 2, 3]

# Refusal templates: MUST be checked by a native speaker before use
refusals:
  en: "I don't know."
  es: "No lo sé."
  ar: "لا أعرف."
  id: "Saya tidak tahu."
  ms: "Saya tidak tahu."
  tr: "Bilmiyorum."
  sw: "Sijui."

prompt_template: "Question: {question}\nAnswer:"

# Few-shot prefix per language (short answers, none of these are MKQA test questions).
# Without it the base model answers in long sentences and keeps generating new questions,
# which breaks consistency labels. Used identically for sampling, training and evaluation.
few_shot:
  en: "Question: What is the capital of Japan?\nAnswer: Tokyo\n\nQuestion: In which year did World War II end?\nAnswer: 1945\n\nQuestion: Who painted the Mona Lisa?\nAnswer: Leonardo da Vinci\n\n"
  es: "Question: ¿Cuál es la capital de Japón?\nAnswer: Tokio\n\nQuestion: ¿En qué año terminó la Segunda Guerra Mundial?\nAnswer: 1945\n\nQuestion: ¿Quién pintó la Mona Lisa?\nAnswer: Leonardo da Vinci\n\n"
  ar: "Question: ما هي عاصمة اليابان؟\nAnswer: طوكيو\n\nQuestion: في أي عام انتهت الحرب العالمية الثانية؟\nAnswer: 1945\n\nQuestion: من رسم الموناليزا؟\nAnswer: ليوناردو دا فينشي\n\n"
  ms: "Question: Apakah ibu negara Jepun?\nAnswer: Tokyo\n\nQuestion: Pada tahun berapakah Perang Dunia Kedua tamat?\nAnswer: 1945\n\nQuestion: Siapakah yang melukis Mona Lisa?\nAnswer: Leonardo da Vinci\n\n"

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs
